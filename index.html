<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeX 项目查找器</title>
<!-- SESSION_TOKEN -->
<style>
:root{color-scheme:light;--blue:#2463e9;--ink:#202a3b;--muted:#768196;--line:#e4e9f1;--bg:#f4f6fa}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button,input,select{outline-offset:3px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue)}
.shell{max-width:1500px;margin:auto;padding:28px 32px 16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:13px;align-items:center}.logo{background:var(--blue);color:white;font-size:23px;font-weight:600;display:grid;place-items:center;width:46px;height:46px;border-radius:13px;box-shadow:0 5px 15px #2463e923}h1{font-size:22px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:1px}.privacy{color:#397568;background:#e6f1ed;border:1px solid #d5e8e0;border-radius:30px;padding:5px 12px;font-size:12px}.top-actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:white;color:var(--ink)}.btn:hover{background:#f1f5fc}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1857d6}.searchbar{display:flex;gap:12px}.searchbox{flex:1;position:relative}.searchbox input{width:100%;height:54px;padding:12px 76px 12px 43px;font-size:16px;background:white;border:1px solid #d8e0ec;border-radius:11px;box-shadow:0 2px 4px #15253805}.searchbox svg{position:absolute;left:16px;top:18px;color:var(--muted)}.kbd{position:absolute;right:15px;top:17px;color:#929bac;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}.searchbar>.btn{min-width:102px;font-size:15px}.hints{display:flex;gap:8px;align-items:center;margin:11px 0 16px;color:var(--muted);font-size:12px}.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 11px;background:#fff;color:#546176}.chip:hover{color:var(--blue);border-color:#aec5fa}.filters{display:flex;gap:18px;align-items:center;margin:0 0 18px;font-size:12px;color:#677489;flex-wrap:wrap}.filters select{max-width:310px;background:white;border:1px solid var(--line);border-radius:7px;padding:6px 28px 6px 9px;color:var(--ink)}label{display:flex;gap:6px;align-items:center;cursor:pointer}input[type=checkbox]{accent-color:var(--blue)}.index-info{margin-left:auto;font-size:12px;min-height:21px}.dot{display:inline-block;width:7px;height:7px;background:#3d9a7b;border-radius:50%;margin-right:6px}.busy .dot{background:#e2a53b;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
.main{display:grid;grid-template-columns:370px minmax(0,1fr);gap:17px;height:calc(100vh - 278px);min-height:390px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head b{font-weight:600;font-size:14px}.count{font-size:12px;color:var(--muted)}.results{overflow-y:auto;flex:1}.result{position:relative;padding:15px 16px 15px 18px;border-bottom:1px solid #eef1f6;cursor:pointer;transition:background .15s}.result:hover{background:#f8faff}.result.selected{background:#eef4ff;box-shadow:inset 3px 0 0 var(--blue)}.result-title{margin:0 25px 5px 0;font-size:14px;line-height:1.55;font-weight:600;overflow-wrap:anywhere}.result-meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:9px}.result-project{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px}.badge{padding:1px 6px;border-radius:4px;background:#f0f2f6;color:#768095;font-size:10px;white-space:nowrap}.result-snippet{font-size:12px;color:#626f83;white-space:pre-wrap;overflow-wrap:anywhere;max-height:77px;overflow:hidden;line-height:1.6}.result-origin{margin-top:7px;color:#8994a5;font-size:10px}.star{position:absolute;right:12px;top:13px;border:0;background:none;color:#a5b0c0;font-size:21px;padding:0 3px}.star.on{color:#d99b24}.pager{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.pager .btn{padding:3px 9px;font-size:11px}.empty{display:flex;flex:1;align-items:center;justify-content:center;flex-direction:column;padding:30px;color:var(--muted);text-align:center}.empty svg{color:#b9c9e0;margin-bottom:18px}.empty h2{font-size:17px;margin:0 0 8px;color:#65758e;font-weight:500}.empty p{font-size:12px;line-height:1.9;margin:0}.detail-header{padding:20px 22px 15px;border-bottom:1px solid var(--line)}.detail-title{margin:0 0 11px;font-size:18px;font-weight:650;overflow-wrap:anywhere}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.path{font-size:11px;color:#8490a2;overflow-wrap:anywhere;margin-top:11px}.conversation-head{padding:12px 22px;background:#fafbfd;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}.conversation-head label{margin-left:auto}.messages{padding:18px 22px;overflow:auto;flex:1}.message{margin-bottom:21px}.message-head{display:flex;align-items:center;gap:9px;font-size:11px;color:#8b96a7;margin-bottom:7px}.role{font-size:11px;color:#526887;background:#eaf0f9;border-radius:5px;padding:2px 7px}.role.user{color:#657269;background:#ecf2ee}.message-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.9;padding:13px 16px;background:#f8f9fc;border:1px solid #edf0f5;border-radius:9px;user-select:text}.message.user .message-body{background:#fcfcfd}.copy{margin-left:auto;border:0;background:none;color:#768dab;font-size:11px;padding:2px 5px}.copy:hover{color:var(--blue)}mark{color:#805815;background:#fff0be;border-radius:2px;padding:0 1px}.older{display:block;margin:0 auto 15px;font-size:12px}.footer{display:flex;justify-content:space-between;margin-top:12px;color:#98a2b2;font-size:11px}.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);padding:11px 19px;border-radius:9px;color:white;background:#263750;box-shadow:0 4px 18px #0002;max-width:90vw;z-index:9}.loading{padding:35px;text-align:center;color:var(--muted);font-size:13px}.danger{color:#b85d3b}.hidden{display:none!important}
@media(max-width:950px){.shell{padding:20px}.main{grid-template-columns:310px minmax(0,1fr)}.privacy{display:none}.index-info{margin-left:0}.filters{gap:11px}.main{height:calc(100vh - 270px)}}@media(max-width:700px){.main{display:flex;flex-direction:column;height:auto}.results{max-height:340px}.messages{max-height:560px}.top-actions .btn{font-size:11px;padding:7px 8px}.hints{flex-wrap:wrap}.kbd{display:none}.searchbox input{padding-right:12px}.sub{max-width:200px}.footer{gap:12px}.detail-header{padding:17px}}
.views{display:flex;gap:4px;padding:3px;background:#e9edf5;border-radius:9px;margin:0 0 11px;width:max-content}.view{border:0;background:transparent;color:#485770;border-radius:6px;padding:7px 14px}.view[aria-pressed=true]{color:#193e8d;background:white;font-weight:650;box-shadow:0 1px 3px #15253816}.result-title{display:block;text-align:left;border:0;background:none;color:inherit;padding:0;max-width:calc(100% - 25px)}.result-meta{flex-wrap:wrap;color:#556379;font-size:12px}.result-meta time{white-space:nowrap}.result.recent{padding-top:11px;padding-bottom:10px}.recent .result-meta{margin-bottom:0}.result.recent .star{top:7px}.result-project{max-width:100%}.main{height:calc(100vh - 322px)}.search-help{margin-left:auto;color:#556379}.result-title:focus-visible{outline:2px solid var(--blue);border-radius:3px}
@media(max-width:700px){.main{height:auto}.search-help{margin-left:0}.searchbar>.btn{min-width:auto}.result-meta{gap:4px 8px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo" aria-hidden="true">找</div><div><h1>CodeX 项目查找器</h1><div class="sub">记得一句话，也能找回那个项目</div></div></div><div class="top-actions"><span class="privacy">仅本机 · 原记录只读</span><button class="btn" id="refresh">更新记录</button><button class="btn" id="quit" title="关闭查找工具，不影响 Codex">退出</button></div></header>
<nav class="views" aria-label="对话列表模式"><button class="view" id="recent-mode" aria-pressed="true">最近对话</button><button class="view" id="full-mode" aria-pressed="false">全文搜索</button></nav>
<form class="searchbar" id="form"><div class="searchbox"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg><input id="query" aria-label="搜索对话标题" placeholder="搜对话标题，或用下方项目筛选缩小范围" autocomplete="off"><span class="kbd">Ctrl K</span></div><button class="btn primary" type="submit" id="search-submit">查找标题</button></form>
<div class="hints"><span id="search-scope">只搜标题 · Enter 或点右侧按钮</span><span class="search-help">单击预览 / 双击打开 CLI</span></div><div class="hints hidden" id="full-hints"><span>试着搜</span><button class="chip" data-query="项目 测试">项目 测试</button><button class="chip" data-query="Python">Python</button><button class="chip" data-query="示例">示例</button><span>多个关键词用空格隔开</span></div>
<div class="filters"><select id="project" aria-label="按项目目录筛选"><option value="">全部项目目录</option></select><label><input type="checkbox" id="favorites">只看收藏</label><label><input type="checkbox" id="archived">包含已归档聊天</label><span class="index-info" id="index-info"><span class="dot"></span>连接本机记录…</span></div>
<main class="main"><section class="panel" aria-label="查找结果"><div class="panel-head"><b id="list-title">最近的聊天</b><span class="count" id="count"></span></div><div class="results" id="results"></div><div class="pager hidden" id="pager"><button class="btn" id="previous">上一页</button><span id="page-label"></span><button class="btn" id="next">下一页</button></div></section><section class="panel" id="detail" aria-label="聊天原文预览"><div class="empty"><svg width="58" height="58" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="10" y="8" width="42" height="48" rx="6"/><path d="M19 22h24M19 31h20M19 40h12"/></svg><h2>找到项目，先看一下原话</h2><p>左边选一条聊天，这里直接预览命中的消息<br>确认是它，再一键回到 Codex 继续聊</p></div></section></main>
<div class="footer"><span id="footer-stats">首次整理后，后续只更新新增内容</span><span>搜索索引保存在 F 盘 · 不上传、不删改聊天</span></div>
</div><div class="toast hidden" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),token=document.querySelector('meta[name="finder-token"]')?.content||location.hash.slice(1);let terms=[],selected=null,page=0,total=0,searchVersion=0,detailVersion=0,lastRunning=true,statusTimer,recentTimer,toastTimer,view="recent",lastResultKey="";const pendingCli=new Set();
if(token&&location.hash)history.replaceState(null,'',location.pathname+location.search);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'X-Project-Finder-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await response.json();if(response.status===403){location.reload();throw Error('会话已更新，正在重新连接')}if(!response.ok)throw Error(data.error||'操作失败');return data}
function date(t,full=false){if(!t)return'';return new Date(t*1000).toLocaleString('zh-CN',full?{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}:{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'})}
function highlight(node,text){if(!terms.length){node.textContent=text;return}const sorted=[...terms].sort((a,b)=>b.length-a.length);const re=new RegExp(sorted.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi');let last=0;for(const match of text.matchAll(re)){node.append(document.createTextNode(text.slice(last,match.index)),el('mark','',match[0]));last=match.index+match[0].length}node.append(document.createTextNode(text.slice(last)))}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch{toast('复制受限，可以选中原文按 Ctrl C')}}
function setProjects(projects){const menu=$('project'),current=menu.value,values=Array.from(menu.options).slice(1).map(o=>o.value);if(JSON.stringify(values)===JSON.stringify(projects))return;menu.replaceChildren(new Option('全部项目目录',''),...projects.map(p=>new Option(p,p)));menu.value=projects.includes(current)?current:''}
function setView(next){view=next;$('recent-mode').setAttribute('aria-pressed',String(next==='recent'));$('full-mode').setAttribute('aria-pressed',String(next==='full'));$('full-hints').classList.toggle('hidden',next==='recent');$('query').setAttribute('aria-label',next==='recent'?'搜索对话标题':'搜索对话全文');$('query').placeholder=next==='recent'?'搜对话标题，或用下方项目筛选缩小范围':'客户名、资料名、金额，或一段以前说过的话';$('search-submit').textContent=next==='recent'?'查找标题':'搜索全文';$('search-scope').textContent=next==='recent'?'只搜标题 · Enter 或点右侧按钮':'搜标题和已索引的聊天正文 · Enter 或点右侧按钮';runSearch()}
async function runSearch(reset=true,quiet=false){
  if(reset)page=0;
  const version=++searchVersion,recent=view==='recent';
  const params=new URLSearchParams({q:$('query').value,project:$('project').value,archived:$('archived').checked?'1':'0',favorites:$('favorites').checked?'1':'0',page:String(page)});
  if(!quiet)$('count').textContent='查找中…';
  try{
    const data=await api((recent?'/api/recent?':'/api/search?')+params);
    if(version!==searchVersion)return;
    if(data.projects)setProjects(data.projects);
    terms=data.terms;total=data.total;
    const key=JSON.stringify([view,terms,data.results]);
    if(key!==lastResultKey){const scroll=$('results').scrollTop;renderResults(data.results,recent);if(quiet)$('results').scrollTop=scroll;lastResultKey=key}
    $('list-title').textContent=$('favorites').checked?'收藏的对话':recent?($('query').value.trim()?'标题搜索结果':'最近对话 · 按最后活动排序'):'全文搜索结果';
    $('count').textContent=total+' 条';
    $('pager').classList.toggle('hidden',total<=50);$('previous').disabled=page===0;
    const max=recent?total:Math.min(total,1000);
    $('next').disabled=(page+1)*50>=max;$('page-label').textContent=(page+1)+' / '+Math.max(1,Math.ceil(max/50));
    if(!recent&&total>1000)toast('命中较多，先展示最近1000条，可以加个关键词缩小范围');
  }catch(e){if(version!==searchVersion)return;if(!quiet){$('count').textContent='';toast(e.message)}}
}
async function openCLI(id){
  if(pendingCli.has(id))return;
  pendingCli.add(id);
  try{await api('/api/open-cli',{id});toast('已请求 Windows 终端接续这条对话')}
  catch(e){toast(e.message)}
  finally{setTimeout(()=>pendingCli.delete(id),800)}
}
function renderResults(rows,recent){
  $('results').replaceChildren();
  if(!rows.length){$('results').append(el('div','loading',recent?'没有匹配的对话。试试其他标题，或切换到“全文搜索”。':'暂时没找到，可以换个短关键词，或点“更新记录”。'));return}
  for(const row of rows){
    const card=el('div','result'+(recent?' recent':'')+(selected===row.id?' selected':''));
    card.dataset.id=row.id;card.title='单击预览，双击在 CLI 打开';
    const title=el('button','result-title');title.type='button';highlight(title,row.title);
    const meta=el('div','result-meta');
    meta.append(el('span','result-project',row.project));
    const stamp=row.last_chat||row.updated;
    const clock=el('time','',stamp?(row.last_chat?'最后聊天 ':'最后活动 ')+date(stamp,true):'时间未知');
    if(stamp)clock.dateTime=new Date(stamp*1000).toISOString();
    meta.append(clock);
    if(row.archived)meta.append(el('span','badge','已归档'));
    if(!row.indexed&&!recent)meta.append(el('span','badge','整理中'));
    const star=el('button','star'+(row.favorite?' on':''),row.favorite?'★':'☆');star.type='button';
    star.title=row.favorite?'取消收藏':'收藏这个聊天';star.setAttribute('aria-label',star.title);
    star.onclick=async event=>{event.stopPropagation();try{await api('/api/favorite',{id:row.id,value:!row.favorite});row.favorite=!row.favorite;star.textContent=row.favorite?'★':'☆';star.classList.toggle('on',!!row.favorite);if($('favorites').checked)runSearch(false)}catch(e){toast(e.message)}};
    card.append(title,meta);
    if(!recent){const snippet=el('div','result-snippet');highlight(snippet,row.snippet);card.append(snippet,el('div','result-origin',row.role==='assistant'?'命中助手回复':row.role==='user'?'命中你发的消息':'命中项目名称 / 资料'))}
    card.append(star);
    card.onclick=()=>loadDetail(row.id);
    card.ondblclick=e=>{if(!e.target.closest('.star'))openCLI(row.id)};
    title.onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();openCLI(row.id)}};
    $('results').append(card);
  }
}
async function loadDetail(id,all=false,before=0,append=false){selected=id;for(const card of document.querySelectorAll('.result'))card.classList.toggle('selected',card.dataset.id===id);const version=++detailVersion;if(!append)$('detail').replaceChildren(el('div','loading','读取原话…'));try{const data=await api('/api/thread?'+new URLSearchParams({id,q:view==='full'?$('query').value:'',all:all?'1':'0',before:String(before)}));if(version!==detailVersion)return;if(append){const current=$('messages');$('older')?.remove();const nodes=messageNodes(data);current.prepend(...nodes);if(data.more)current.prepend(olderButton(data,all));return}renderDetail(data,all)}catch(e){if(version===detailVersion)$('detail').replaceChildren(el('div','loading',e.message))}}
function messageNodes(data){return data.messages.map(message=>{const box=el('article','message '+message.role),head=el('div','message-head');head.append(el('span','role '+message.role,message.role==='assistant'?'助手回复':'你发的消息'),el('span','',date(message.stamp,true)));const button=el('button','copy','复制这条');button.onclick=()=>copy(message.text);head.append(button);const body=el('div','message-body');highlight(body,message.text);box.append(head,body);return box})}
function olderButton(data,all){const button=el('button','btn older','加载更早的消息');button.id='older';button.onclick=()=>loadDetail(data.thread.id,all,data.before,true);return button}
function renderDetail(data,all){$('detail').replaceChildren();const thread=data.thread,header=el('div','detail-header');header.append(el('h2','detail-title',thread.title));const actions=el('div','detail-actions'),open=el('button','btn','在桌面端打开'),cli=el('button','btn primary','在 CLI 打开'),folder=el('button','btn','打开项目目录'),id=el('button','btn','复制聊天链接');open.onclick=async()=>{try{await api('/api/open',{id:thread.id});toast('已交给 Codex 打开这个聊天')}catch(e){toast(e.message)}};folder.onclick=async()=>{try{await api('/api/folder',{id:thread.id})}catch(e){toast(e.message)}};id.onclick=()=>copy('codex://threads/'+thread.id);cli.onclick=()=>openCLI(thread.id);actions.append(cli,open,folder,id);header.append(actions,el('div','path',thread.cwd));const line=el('div','conversation-head');line.append(el('span','',terms.length&&!all?'命中的原话':'聊天消息预览'));const label=el('label',''),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=all;checkbox.onchange=()=>loadDetail(thread.id,checkbox.checked);label.append(checkbox,document.createTextNode('看全部消息'));line.append(label);const messages=el('div','messages');messages.id='messages';if(data.more)messages.append(olderButton(data,all));messages.append(...messageNodes(data));if(!data.messages.length)messages.append(el('div','loading','名称或资料信息匹配到了；正文仍在整理，可以直接打开原聊天'));
$('detail').append(header,line,messages)}
async function status(){try{const s=await api('/api/status');$('index-info').classList.remove('danger');$('index-info').classList.toggle('busy',s.running);$('index-info').replaceChildren(el('span','dot'),document.createTextNode(s.running?'整理记录 '+s.done+' / '+s.total:'已整理 '+s.chats+' 条聊天'+(s.errors.length?' · '+s.errors.length+' 条未完全读取':'')));$('index-info').title=s.running?s.current:s.errors.map(e=>e.title+'：'+e.reason).join('\n');$('refresh').disabled=s.running;$('footer-stats').textContent=s.running?'首次整理中，已经搜到的记录可以直接打开':s.messages.toLocaleString()+' 条历史消息 · '+(s.last_update?'更新于 '+date(s.last_update,true):'索引已就绪');if(lastRunning&&!s.running){await runSearch(false,true);if(s.errors.length)toast('部分旧聊天文件不可用，名称仍可查；详情见整理状态')}lastRunning=s.running}catch(e){$('index-info').textContent='连接暂时中断，正在重试；若未恢复，请重新启动软件';$('index-info').classList.add('danger')}}
$('form').onsubmit=e=>{e.preventDefault();runSearch()};$('query').oninput=()=>{clearTimeout(window.searchDebounce);window.searchDebounce=setTimeout(()=>runSearch(),400)};for(const id of ['project','favorites','archived'])$(id).onchange=()=>runSearch();$('recent-mode').onclick=()=>setView('recent');$('full-mode').onclick=()=>setView('full');for(const chip of document.querySelectorAll('[data-query]'))chip.onclick=()=>{$('query').value=chip.dataset.query;runSearch()};$('previous').onclick=()=>{page--;runSearch(false)};$('next').onclick=()=>{page++;runSearch(false)};document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('query').focus();$('query').select()}};$('refresh').onclick=async()=>{try{await api('/api/refresh',{});lastRunning=true;await status();toast('正在更新，只处理新增或变化的记录')}catch(e){toast(e.message)}};$('quit').onclick=async()=>{try{await api('/api/quit',{});clearInterval(statusTimer);clearInterval(recentTimer);$('detail').replaceChildren(el('div','empty','已退出，可以关闭这个窗口。原聊天和搜索索引都保留。'));$('index-info').textContent='已退出'}catch(e){toast(e.message)}};
if(!token){$('detail').replaceChildren(el('div','empty','请运行 python -X utf8 app.py --open 启动，不能直接打开网页文件'))}else{runSearch();status();statusTimer=setInterval(status,4000);recentTimer=setInterval(()=>{if(view==='recent'&&document.hasFocus()&&!$('results').contains(document.activeElement))runSearch(false,true)},20000);$('query').focus()}
</script>
